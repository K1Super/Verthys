# .github/workflows/core.yml
# core 构建与测试流水线
#
# Rust 测试与类型检查、前端 security-test.ts 由 rust-frontend.yml 承接；
# 本文件聚焦 core DLL 质量门 + vendored 依赖供应链门。
name: core-build-test

on:
  push:
    paths: ["core/**", "cmake/**", "third_party/**", "CMakeLists.txt", "dep-versions.txt", "scripts/build_core.*", "ci/**", ".github/workflows/core.yml", "verthys-tauri/src-tauri/src/**", "verthys-tauri/verthys-worker/src/**"]
  pull_request:
    paths: ["core/**", "cmake/**", "third_party/**", "CMakeLists.txt", "dep-versions.txt", "scripts/build_core.*", "ci/**", ".github/workflows/core.yml", "verthys-tauri/src-tauri/src/**", "verthys-tauri/verthys-worker/src/**"]

jobs:
  ast-redline:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust (pinned by rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@master

      - name: AST red-line gate (level 2, baseline-exempted)
        shell: pwsh
        run: |
          & ".\ci\run_ci.ps1" -Level2Only
          if ($LASTEXITCODE -ne 0) { throw "AST red-line violations (new violations are blocking)" }

  clang-tidy:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSVC (x64)
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Find clang-tidy
        shell: pwsh
        run: |
          $candidates = @(
            "${env:VCToolsInstallDir}\..\..\..\Tools\Llvm\x64\bin\clang-tidy.exe",
            "${env:ProgramFiles}\LLVM\bin\clang-tidy.exe",
            "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Tools\Llvm\x64\bin\clang-tidy.exe",
            "C:\Program Files\Microsoft Visual Studio\2022\Community\VC\Tools\Llvm\x64\bin\clang-tidy.exe"
          )
          $found = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $found) {
            # 兜底：winget/choco 安装 LLVM 后重试
            choco install llvm -y --no-progress
            $found = "C:\Program Files\LLVM\bin\clang-tidy.exe"
          }
          Add-Content $env:GITHUB_PATH (Split-Path $found)
          Write-Host "clang-tidy: $found"

      - name: Configure (Ninja + clang-tidy gate)
        run: |
          cmake -S . -B build_tidy -G Ninja -DCMAKE_BUILD_TYPE=Debug -DVERTHYS_ENABLE_CLANG_TIDY=ON

      - name: Build under clang-tidy (WarningsAsErrors: UAF/StackAddressEscape/Malloc)
        run: |
          cmake --build build_tidy --config Debug
  build-and-test:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify vendored dependency hashes (supply-chain gate)
        shell: pwsh
        run: |
          & ".\ci\verify_vendor_hashes.ps1"
          if ($LASTEXITCODE -ne 0) { throw "vendor hash gate failed" }

      - name: Setup MSVC (x64)
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure (Ninja)
        run: |
          cmake -S . -B build_ci -G Ninja -DCMAKE_BUILD_TYPE=Debug

      - name: Build (Debug + tests)
        run: |
          cmake --build build_ci --config Debug

      - name: Run C tests
        run: |
          & ".\build_ci\core\verthys_tests.exe"
          if ($LASTEXITCODE -ne 0) { throw "C tests failed" }
        shell: pwsh

      - name: Build (Release + .vsec integrity baseline injection)
        run: |
          & ".\scripts\build_core.release.ps1" -NoPause
          if ($LASTEXITCODE -ne 0) { throw "Release build failed" }
        shell: pwsh

      - name: Export surface whitelist check (P0-A regression gate)
        shell: pwsh
        run: |
          $dumpbin = Get-ChildItem "${env:VCToolsInstallDir}\bin\Hostx64\x64\dumpbin.exe" | Select-Object -First 1
          if (-not $dumpbin) { throw "dumpbin.exe not found" }
          $out = & $dumpbin.FullName -exports ".\build\core\Release\verthys.dll" 2>&1 | Out-String
          $actual = [regex]::Matches($out, 'Verthys_[A-Za-z0-9]+') |
                    ForEach-Object { $_.Value } | Sort-Object -Unique
          # dumpbin 输出中正则会截断包含数字的符号名，先对已知数字后缀做还原映射
          $actual = $actual | ForEach-Object {
              if ($_ -eq 'Verthys_MigrateV') { 'Verthys_MigrateV1ToV2' } else { $_ }
          }
          $baseline = Get-Content ".\ci\export_baseline.txt" | Where-Object { $_.Trim() -ne '' } | Sort-Object -Unique
          $diff = Compare-Object @($baseline) @($actual)
          if ($diff) {
              $diff | ForEach-Object { Write-Host "EXPORT-DIFF: $($_.SideIndicator) $($_.InputObject)" }
              throw "导出面与白名单基线不一致（P0-A 回归）"
          }
          Write-Host "导出面白名单校验通过：$(@($actual).Count) 个符号"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: verthys-dll
          path: build/core/Release/verthys.dll
          retention-days: 7

  #   与主构建门并行；崩溃/ASAN 报告 → 门红 + 崩溃样本工件留存。
  fuzz:
    runs-on: windows-latest
    timeout-minutes: 75
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSVC (x64)
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure (Ninja + libFuzzer)
        run: |
          cmake -S . -B build_fuzz -G Ninja -DCMAKE_BUILD_TYPE=Debug -DVERTHYS_ENABLE_FUZZ=ON

      - name: Build (instrumented core + 5 fuzz targets + seed corpus)
        run: |
          cmake --build build_fuzz --config Debug

      - name: Smoke gate (bounded runs, fail-fast)
        run: |
          ctest --test-dir build_fuzz -C Debug -R "fuzz_.*_smoke" --output-on-failure --no-tests=error
          if ($LASTEXITCODE -ne 0) { throw "fuzz smoke gate failed" }
        shell: pwsh

      - name: Sustained fuzzing (10 min per target)
        run: |
          $targets = @("superblock", "partition", "extent", "sstable", "import")
          foreach ($t in $targets) {
            Write-Host "=== fuzz_$t : 10 min ==="
            & ".\build_fuzz\core\tests\fuzz\fuzz_$t.exe" `
              ".\build_fuzz\core\tests\fuzz\corpus\$t" `
              -max_total_time=600 -max_len=1048576 -timeout=25 `
              -print_final_stats=1
            if ($LASTEXITCODE -ne 0) {
              throw "fuzz_$t crashed (see crash-* files in build_fuzz/core/tests/fuzz)"
            }
          }
        shell: pwsh

      - name: Upload crash artifacts (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-crash-artifacts
          path: |
            build_fuzz/core/tests/fuzz/crash-*
            build_fuzz/core/tests/fuzz/oom-*
            build_fuzz/core/tests/fuzz/timeout-*
            build_fuzz/core/tests/fuzz/corpus/
          retention-days: 30
          if-no-files-found: ignore
