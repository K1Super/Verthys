# core 构建与测试流水线
#
# Rust 测试、前端类型检查与单测由独立的前端/Rust 流水线承接；
# 本文件聚焦 core DLL 质量门 + vendored 依赖供应链门。
name: core-build-test

on:
  push:
    paths: ["core/**", "cmake/**", "third_party/**", "CMakeLists.txt", "dep-versions.txt", "build_dev.ps1", "build_production.ps1", ".clang-tidy", "scripts/**", "ci/**", "tests/attack/**", ".github/workflows/core.yml", "verthys-tauri/src-tauri/src/**", "verthys-tauri/verthys-worker/src/**", "VERSION"]
  pull_request:
    paths: ["core/**", "cmake/**", "third_party/**", "CMakeLists.txt", "dep-versions.txt", "build_dev.ps1", "build_production.ps1", ".clang-tidy", "scripts/**", "ci/**", "tests/attack/**", ".github/workflows/core.yml", "verthys-tauri/src-tauri/src/**", "verthys-tauri/verthys-worker/src/**", "VERSION"]

jobs:
  ast-redline:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Version consistency gate (VERSION single source)
        shell: pwsh
        run: |
          & ".\ci\sync_version.ps1" -CheckOnly
          if ($LASTEXITCODE -ne 0) { throw "version drift: edit root VERSION then run ci\sync_version.ps1" }

      - name: Version naming gate (no generation suffixes / retired V3 build)
        shell: pwsh
        run: |
          & ".\ci\check_version_naming.ps1"
          if ($LASTEXITCODE -ne 0) { throw "version naming gate failed" }

      - name: Setup Rust (pinned by rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.98.1"
          components: clippy, rustfmt

      - name: Setup MSVC (x64)
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Build core DLL (Release, Ninja)
        shell: pwsh
        run: |
          cmake -S . -B build_ci_ast -G Ninja -DCMAKE_BUILD_TYPE=Release
          if ($LASTEXITCODE -ne 0) { throw "cmake configure failed" }
          cmake --build build_ci_ast --target verthys_core
          if ($LASTEXITCODE -ne 0) { throw "cmake build failed" }

      - name: Stage packaging assets (verthys.dll + verthys-worker.exe)
        shell: pwsh
        run: |
          $dll = Get-ChildItem -Path build_ci_ast -Recurse -Filter verthys.dll |
                 Select-Object -First 1
          if (-not $dll) { throw "verthys.dll not found under build_ci_ast" }
          Copy-Item $dll.FullName "verthys-tauri/src-tauri/verthys.dll" -Force
          cargo build --release --manifest-path verthys-tauri/verthys-worker/Cargo.toml
          if ($LASTEXITCODE -ne 0) { throw "worker release build failed" }
          New-Item -ItemType Directory -Force -Path "verthys-tauri/src-tauri/binaries" | Out-Null
          Copy-Item "verthys-tauri/verthys-worker/target/release/verthys-worker.exe" `
            "verthys-tauri/src-tauri/binaries/verthys-worker-x86_64-pc-windows-msvc.exe" -Force

          # tauri-build 还会校验 service-payload 资源；CI 只做静态检查，
          # 服务不签名，根 CA 使用临时自签名证书满足资源校验。
          & ".\scripts\build\build_security_service.ps1" -Profile local -NoSign
          if ($LASTEXITCODE -ne 0) { throw "security service build failed" }
          New-Item -ItemType Directory -Force -Path "verthys-tauri/src-tauri/service-payload" | Out-Null
          Copy-Item "build_security_service\artifacts\VerthysSecuritySvc.exe" `
            "verthys-tauri/src-tauri/service-payload/VerthysSecuritySvc.exe" -Force
          $rootCa = New-SelfSignedCertificate -Type Custom -Subject "CN=Verthys CI Test Root" `
            -KeyUsage CertSign -CertStoreLocation Cert:\CurrentUser\My
          [System.IO.File]::WriteAllBytes(
            (Join-Path $PWD "verthys-tauri/src-tauri/service-payload/VerthysRootCA.cer"),
            $rootCa.RawData)

      - name: AST red-line gate (level 2, baseline-exempted)
        shell: pwsh
        run: |
          & ".\ci\run_ci.ps1" -Level2Only
          if ($LASTEXITCODE -ne 0) { throw "AST red-line violations (new violations are blocking)" }

  clang-tidy:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSVC (x64)
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Find clang-tidy
        shell: pwsh
        run: |
          $candidates = @(
            "${env:VCToolsInstallDir}\..\..\..\Tools\Llvm\x64\bin\clang-tidy.exe",
            "${env:ProgramFiles}\LLVM\bin\clang-tidy.exe",
            "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Tools\Llvm\x64\bin\clang-tidy.exe",
            "C:\Program Files\Microsoft Visual Studio\2022\Community\VC\Tools\Llvm\x64\bin\clang-tidy.exe"
          )
          $found = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $found) {
            # 兜底：winget/choco 安装 LLVM 后重试
            choco install llvm -y --no-progress
            $found = "C:\Program Files\LLVM\bin\clang-tidy.exe"
          }
          # 只把 clang-tidy 路径传给 CMake；不要加入 PATH，否则 CMake 可能把
          # clang.exe 选为 C 编译器，导致 vendored AVX-512 源码编译失败。
          Add-Content $env:GITHUB_ENV "VERTHYS_CLANG_TIDY_EXE=$found"
          Write-Host "clang-tidy: $found"

      - name: Configure (Ninja + clang-tidy gate)
        run: |
          cmake -S . -B build_tidy -G Ninja -DCMAKE_BUILD_TYPE=Debug -DVERTHYS_ENABLE_CLANG_TIDY=ON -DVERTHYS_CLANG_TIDY_EXE="$env:VERTHYS_CLANG_TIDY_EXE" -DCMAKE_C_COMPILER=cl.exe

      - name: "Build under clang-tidy (WarningsAsErrors: UAF/StackAddressEscape/Malloc)"
        run: |
          cmake --build build_tidy --config Debug
  build-and-test:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify vendored dependency hashes (supply-chain gate)
        shell: pwsh
        run: |
          & ".\ci\verify_vendor_hashes.ps1"
          if ($LASTEXITCODE -ne 0) { throw "vendor hash gate failed" }

      - name: Setup MSVC (x64)
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure (Ninja)
        run: |
          # 测试隔离钩子只影响测试构建；生产发布构建显式 OFF。
          # 自动化测试构建同时强制隔离：缺少 VERTHYS_TEST_STATE_DIR 即拒绝运行。
          cmake -S . -B build_ci -G Ninja -DCMAKE_BUILD_TYPE=Debug -DVERTHYS_TEST_HOOKS=ON -DVERTHYS_TEST_REQUIRE_ISOLATION=ON

      - name: Build (Debug + tests)
        run: |
          cmake --build build_ci --config Debug

      - name: Run C tests
        run: ctest --test-dir build_ci -C Debug --output-on-failure --no-tests=error

      - name: Build (Release + .vsec integrity baseline injection)
        run: |
          # 攻击回归需要测试态路径钩子；生产发布构建（build_production.ps1）
          # 显式 OFF，绝不带此钩子。自动化测试产物强制隔离，dev 运行构建不传该开关。
          & ".\scripts\build\build_core.release.ps1" -TestHooks -RequireTestIsolation -NoPause
          if ($LASTEXITCODE -ne 0) { throw "Release build failed" }
        shell: pwsh

      - name: Export surface whitelist check (P0-A regression gate)
        shell: pwsh
        run: |
          $dumpbin = Get-ChildItem "${env:VCToolsInstallDir}\bin\Hostx64\x64\dumpbin.exe" | Select-Object -First 1
          if (-not $dumpbin) { throw "dumpbin.exe not found" }
          $out = & $dumpbin.FullName -exports ".\build\core\Release\verthys.dll" 2>&1 | Out-String
          $actual = [regex]::Matches($out, 'Verthys_[A-Za-z0-9]+') |
                    ForEach-Object { $_.Value } | Sort-Object -Unique
          # 白名单直接读 core/verthys.def 的 EXPORTS 节（导出面唯一
          # 权威源）；无任何符号名手工映射，规避 dumpbin 正则在
          # 数字后缀符号上的截断假阳性
          $baseline = Get-Content ".\core\verthys.def" |
                      Where-Object { $_ -match '^\s+Verthys_' } |
                      ForEach-Object { ($_ -split ';')[0].Trim() } |
                      Where-Object { $_ -ne '' } | Sort-Object -Unique
          $diff = Compare-Object @($baseline) @($actual)
          if ($diff) {
              $diff | ForEach-Object { Write-Host "EXPORT-DIFF: $($_.SideIndicator) $($_.InputObject)" }
              throw "导出面与白名单基线不一致（P0-A 回归）"
          }
          Write-Host "导出面白名单校验通过：$(@($actual).Count) 个符号"

      - name: "Attack regression gate (P0-A: A1/A3/A4/A9 必须全部拒绝)"
        timeout-minutes: 30
        shell: pwsh
        run: |
          & ".\tests\attack\run.ps1" -OutJson ".\build\attack-postfix.json"
          if ($LASTEXITCODE -ne 0) { throw "attack regression failed: A1/A3/A4/A9 not all rejected" }

      - name: Attack harness positive control (公开常量必须被识别为攻击成功)
        timeout-minutes: 10
        shell: pwsh
        run: |
          & ".\tests\attack\run.ps1" -Baseline -OutJson ".\build\attack-baseline.json"
          if ($LASTEXITCODE -ne 0) { throw "attack baseline control failed: harness cannot detect the known attack" }

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: verthys-dll
          path: |
            build/core/Release/verthys.dll
            build/attack-postfix.json
            build/attack-baseline.json
          retention-days: 7


