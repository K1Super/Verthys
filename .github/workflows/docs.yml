# Documentation gate: link integrity, index coverage, metadata and version claims.
name: docs

on:
  push:
    paths:
      - "docs/**"
      - "README.md"
      - "CONTRIBUTING.md"
      - "CHANGELOG.md"
      - "ci/check_docs.ps1"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "docs/**"
      - "README.md"
      - "CONTRIBUTING.md"
      - "CHANGELOG.md"
      - "ci/check_docs.ps1"
      - ".github/workflows/docs.yml"

jobs:
  check:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Documentation gate
        shell: pwsh
        run: |
          & ".\ci\check_docs.ps1"
          if ($LASTEXITCODE -ne 0) { throw "documentation gate failed" }
