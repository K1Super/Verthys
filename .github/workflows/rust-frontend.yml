# .github/workflows/rust-frontend.yml
# P2-4 修复（2026-09-19）：Rust / 前端 CI 质量门
#
# 覆盖（对应 core.yml 注释中"由本工作流承接"的承诺）：
#   1. Rust 单元测试（src-tauri 314 项 + verthys-worker 18 项）
#   2. cargo clippy 静态检查（--all-targets -D warnings，零告警门）
#   3. 前端单元测试（vitest，验证进度感知层状态机核心路径）
#   4. 前端 TypeScript 类型检查（vue-tsc --noEmit）
#   5. 前端生产构建（vite build，验证打包链完整性）
#
# 素材前置（2026-09-19 隔离实证）：tauri 编译期强制要求
#   resources（verthys.dll）与 externalBin（binaries/verthys-worker-*.exe）
#   存在，缺失即 "resource path ... doesn't exist" 编译失败。
#   二者均为 gitignore 的构建产物，故本工作流先从源码构建并就位：
#   - C 核心 DLL：Ninja Release 构建（仅满足编译期依赖，不做 .vsec 注入——
#     发布级 DLL 由 core.yml 的 build_core.release.ps1 产出并上传工件）
#   - worker：cargo build --release 后复制至 binaries/
#   dist/ 在 dev profile 下不参与编译（cfg=dev 走 devUrl），无需前置。
#
# 门禁语义：任一步失败即红，禁止合入。
name: rust-frontend-check

on:
  push:
    paths: ["verthys-tauri/**", "dep-versions.txt", ".github/workflows/rust-frontend.yml", "VERSION", "ci/**", "scripts/**", "build_dev.ps1", "build_production.ps1", ".clang-tidy", "deny.toml", ".github/dependabot.yml"]
  pull_request:
    paths: ["verthys-tauri/**", "dep-versions.txt", ".github/workflows/rust-frontend.yml", "VERSION", "ci/**", "scripts/**", "build_dev.ps1", "build_production.ps1", ".clang-tidy", "deny.toml", ".github/dependabot.yml"]

jobs:
  rust-and-frontend:
    runs-on: windows-latest
    timeout-minutes: 50
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Version consistency gate (VERSION single source)
        shell: pwsh
        run: |
          & ".\ci\sync_version.ps1" -CheckOnly
          if ($LASTEXITCODE -ne 0) { throw "version drift: edit root VERSION then run ci\sync_version.ps1" }

      - name: Setup Rust (pinned by rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@master

      - name: Restore Rust build cache (per-workspace)
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            verthys-tauri/src-tauri
            verthys-tauri/verthys-worker

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: verthys-tauri/package-lock.json

      - name: Verify vendored dependency hashes (supply-chain gate)
        shell: pwsh
        run: |
          & ".\ci\verify_vendor_hashes.ps1"
          if ($LASTEXITCODE -ne 0) { throw "vendor hash gate failed" }

      - name: Install cargo-deny (locked)
        run: cargo install --locked cargo-deny

      - name: Supply-chain scan (cargo-deny: advisories/licenses/bans/sources)
        shell: pwsh
        run: |
          # 仓库无根 workspace：两个独立 crate 分别以各自 manifest 扫描
          # （deny.toml 位于仓库根，经 manifest 父目录链自动发现）
          cargo deny --manifest-path verthys-tauri/src-tauri/Cargo.toml check advisories licenses bans sources
          if ($LASTEXITCODE -ne 0) { throw "cargo-deny (src-tauri) gate failed" }
          cargo deny --manifest-path verthys-tauri/verthys-worker/Cargo.toml check advisories licenses bans sources
          if ($LASTEXITCODE -ne 0) { throw "cargo-deny (worker) gate failed" }

      - name: Setup MSVC (x64)
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Build core DLL (Release, Ninja)
        shell: pwsh
        run: |
          cmake -S . -B build_ci -G Ninja -DCMAKE_BUILD_TYPE=Release
          if ($LASTEXITCODE -ne 0) { throw "cmake configure failed" }
          cmake --build build_ci
          if ($LASTEXITCODE -ne 0) { throw "cmake build failed" }

      - name: Stage packaging assets (verthys.dll + verthys-worker.exe)
        shell: pwsh
        run: |
          # 就位 tauri 编译期硬依赖：resources(verthys.dll) + externalBin(worker)
          $dll = Get-ChildItem -Path build_ci -Recurse -Filter verthys.dll |
                 Select-Object -First 1
          if (-not $dll) { throw "verthys.dll not found under build_ci" }
          Copy-Item $dll.FullName "verthys-tauri/src-tauri/verthys.dll" -Force
          Write-Host "staged verthys.dll <- $($dll.FullName)"

          cargo build --release --manifest-path verthys-tauri/verthys-worker/Cargo.toml
          if ($LASTEXITCODE -ne 0) { throw "worker release build failed" }
          Copy-Item "verthys-tauri/verthys-worker/target/release/verthys-worker.exe" `
            "verthys-tauri/src-tauri/binaries/verthys-worker-x86_64-pc-windows-msvc.exe" -Force
          Write-Host "staged verthys-worker.exe"

      - name: Rust tests (src-tauri)
        run: |
          cargo test --manifest-path verthys-tauri/src-tauri/Cargo.toml
          if ($LASTEXITCODE -ne 0) { throw "src-tauri tests failed" }
        shell: pwsh

      - name: Rust tests (verthys-worker)
        run: |
          cargo test --manifest-path verthys-tauri/verthys-worker/Cargo.toml
          if ($LASTEXITCODE -ne 0) { throw "worker tests failed" }
        shell: pwsh

      - name: Clippy gate (zero warnings, all targets)
        run: |
          cargo clippy --manifest-path verthys-tauri/src-tauri/Cargo.toml --all-targets -- -D warnings
          if ($LASTEXITCODE -ne 0) { throw "src-tauri clippy failed" }
          cargo clippy --manifest-path verthys-tauri/verthys-worker/Cargo.toml --all-targets -- -D warnings
          if ($LASTEXITCODE -ne 0) { throw "worker clippy failed" }
        shell: pwsh

      - name: Install frontend dependencies
        run: npm ci
        working-directory: verthys-tauri

      - name: npm vulnerability gate (high+ blocked)
        run: |
          npm audit --audit-level=high
          if ($LASTEXITCODE -ne 0) { throw "npm audit gate failed" }
        shell: pwsh
        working-directory: verthys-tauri

      - name: Dependency snapshot drift gate
        shell: pwsh
        run: |
          & ".\ci\refresh_dep_versions.ps1"
          if ($LASTEXITCODE -ne 0) { throw "dependency snapshot refresh failed" }
          git diff --exit-code -- dep-versions.txt
          if ($LASTEXITCODE -ne 0) {
            throw "dep-versions.txt 与锁文件漂移：请运行 ci\refresh_dep_versions.ps1 并提交快照"
          }
          Write-Host "依赖快照与锁文件一致"

      - name: Frontend unit tests (vitest)
        run: |
          npx vitest run
          if ($LASTEXITCODE -ne 0) { throw "vitest tests failed" }
        shell: pwsh
        working-directory: verthys-tauri

      - name: Frontend type check (vue-tsc)
        run: |
          npx vue-tsc --noEmit
          if ($LASTEXITCODE -ne 0) { throw "vue-tsc type check failed" }
        shell: pwsh
        working-directory: verthys-tauri

      - name: Frontend production build
        run: |
          npm run build
          if ($LASTEXITCODE -ne 0) { throw "vite build failed" }
        shell: pwsh
        working-directory: verthys-tauri

      - name: SBOM (CycloneDX, npm)
        run: |
          npx --yes @cyclonedx/cyclonedx-npm --output-file ../sbom-npm.json
        shell: pwsh
        working-directory: verthys-tauri

      - name: Install cargo-cyclonedx (locked)
        run: cargo install --locked cargo-cyclonedx

      - name: SBOM (CycloneDX, Rust)
        shell: pwsh
        run: |
          cargo cyclonedx -f json --spec-version 1.4 --output-file ../../sbom-cargo.json
          if ($LASTEXITCODE -ne 0) { throw "cargo cyclonedx failed" }
        working-directory: verthys-tauri/src-tauri

      - name: SBOM (CycloneDX, Rust worker)
        shell: pwsh
        run: |
          cargo cyclonedx -f json --spec-version 1.4 --output-file ../../sbom-worker.json
          if ($LASTEXITCODE -ne 0) { throw "worker cyclonedx failed" }
        working-directory: verthys-tauri/verthys-worker

      - name: Upload SBOM artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sbom-artifacts
          path: |
            sbom-npm.json
            sbom-cargo.json
            sbom-worker.json
          retention-days: 30
          if-no-files-found: error

  local-script-smoke:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Version consistency gate (VERSION single source)
        shell: pwsh
        run: |
          & ".\ci\sync_version.ps1" -CheckOnly
          if ($LASTEXITCODE -ne 0) { throw "version drift: edit root VERSION then run ci\sync_version.ps1" }

      - name: Setup Rust (pinned by rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@master

      - name: Restore Rust build cache (per-workspace)
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            verthys-tauri/src-tauri
            verthys-tauri/verthys-worker

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: verthys-tauri/package-lock.json

      - name: Setup MSVC (x64)
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      # 本地一键构建脚本在干净 runner 上的可跑性验证：
      # 覆盖"注入 MSVC 环境探测 + Ninja 单配置 + npm ci + 无写锁补丁断言"
      # 全链路（-SkipTauri：不执行 NSIS 打包，组件级验证）。
      - name: Local one-click build script smoke (-SkipTauri)
        shell: pwsh
        run: |
          & ".\build_production.ps1" -SkipTauri -NoPause
          if ($LASTEXITCODE -ne 0) { throw "build_production.ps1 -SkipTauri failed" }
