# 依赖自动更新：cargo（主 crate + worker）+ npm + GitHub Actions
# 意图：让带 CVE/重要修复的新版本依赖以受控 PR 形式进入视野，
# 与本工作流内 cargo-deny / npm audit 扫描门组成供应链闭环。
# 自动 PR 同样受全部 CI 门禁约束（扫描、测试、构建），不产生旁路。
version: 2
updates:
  - package-ecosystem: cargo
    directory: "/verthys-tauri/src-tauri"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    allow:
      - dependency-type: all
    labels:
      - dependencies
      - cargo

  - package-ecosystem: cargo
    directory: "/verthys-tauri/verthys-worker"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    allow:
      - dependency-type: all
    labels:
      - dependencies
      - cargo

  - package-ecosystem: npm
    directory: "/verthys-tauri"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    allow:
      - dependency-type: all
    labels:
      - dependencies
      - npm

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - github-actions