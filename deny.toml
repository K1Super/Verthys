# cargo-deny 供应链门禁配置（Rust 生态）
#
# 四类检查全开：advisories（CVE/unsound/yanked）、licenses（合规）、
# bans（多重版本/误用）、sources（注册表/来历不明来源）。
# 扫描目标限定 Windows 目标三元组——锁文件包含跨平台传递依赖，
# 仅检出实际会进入 Windows 产物的图谱，避免误报平台无关条目。

[advisories]
# unmaintained/unsound 只接受依赖范围枚举：all/workspace/transitive/none。
# workspace 只约束直接依赖，避免传递依赖的 unmaintained 噪声淹没信号。
unmaintained = "workspace"
unsound = "all"
# yanked 版本属瞬态状态（上游撤版后新解析可自愈），告警不阻断
yanked = "warn"
ignore = [
    # AsyncFd 只在 tokio 的 unix 模块编译，本项目仅构建 Windows 目标。
    { id = "RUSTSEC-2026-0386", reason = "AsyncFd 仅存在于 tokio 的 unix 模块，本项目只构建 Windows 目标" },
    # ts-rs 依赖 chrono 的 chrono-impl；无安全升级版本，替换需迁移时间类型。
    { id = "RUSTSEC-2026-0543", reason = "ts-rs 依赖 chrono 的 chrono-impl；无安全升级版本，替换需迁移时间类型" },
]

[licenses]
# 允许的许可证集合（与当前依赖图谱实测对齐，增量收敛）
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "MPL-2.0",
]
# 未声明许可证依赖：阻断；工作区私有 crate（publish = false）由 private.ignore 跳过
confidence-threshold = 0.8
exceptions = []
private = { ignore = true }

[bans]
# 版本通配符（"*" 依赖）：阻断——锁文件才是版本事实源
wildcards = "deny"
# 同 crate 多版本并存：告警（windows-sys 0.52/0.59 属有意并存，
# 由 Cargo.toml 注释锁定缘由；新出现的重复应被审视而非静默）
multiple-versions = "warn"
deny = []
skip = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]

# 仅对 Windows 产物图谱执行许可证/来源检查
[graph]
targets = ["x86_64-pc-windows-msvc"]
all-features = true
